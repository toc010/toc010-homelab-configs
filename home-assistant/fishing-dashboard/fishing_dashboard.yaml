type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 🎣 Fishing Conditions: Fairfield, CT
  - type: markdown
    content: >
      ### 📍 Today's Conditions

      {% set clabel = states('sensor.fishing_current_condition_label') %} {% set
      cscore = states('sensor.fishing_current_condition_score') | int(0) %} {%
      set cprecip = states('sensor.fishing_today_window_precip_probability') |
      float(states('sensor.fishing_current_hour_precip_probability') | float(0))
      | round %} {% set cwind = states('sensor.fishing_wind_speed') | float(0) |
      round(1) %} {% set ctide = states('sensor.fishing_current_tide_direction')
      %} {% set _phase_raw = states('sensor.moon_phase') %} {% set _phase_map =
      {'new_moon':'🌑 New Moon','waxing_crescent':'🌒 Waxing
      Crescent','first_quarter':'🌓 First Quarter','waxing_gibbous':'🌔 Waxing
      Gibbous','full_moon':'🌕 Full Moon','waning_gibbous':'🌖 Waning
      Gibbous','last_quarter':'🌗 Last Quarter','waning_crescent':'🌘 Waning
      Crescent'} %} {% set moon_cur = _phase_map.get(_phase_raw, _phase_raw |
      replace('_',' ') | title) %} {% set _known_new = (now().date() -
      (now().date() - today())).replace(2000,1,6) if false else namespace() %}
      {% set _cycle = 29.53059 %} {% set _days_since = (now().date() -
      now().date().replace(2000,1,6)).days if false else (now().timestamp() /
      86400 - 10957 - 6) | int %} {% set _pos = (_days_since % _cycle) / _cycle
      %} {% set _illum = (((1 - cos((_pos - 0.5) * 2 * pi)) / 2) * 100) | round
      %} {% set _phases = [('New Moon', 0.0), ('First Quarter', 0.25), ('Full
      Moon', 0.5), ('Last Quarter', 0.75)] %} {% set _ns =
      namespace(nxt_name='', nxt_days=999) %} {% for pname, ppos in _phases %}
        {% set _d = (ppos - _pos) * _cycle if ppos >= _pos else (1.0 - _pos + ppos) * _cycle %}
        {% if _d > 0.5 and _d < _ns.nxt_days %}{% set _ns.nxt_days = _d %}{% set _ns.nxt_name = pname %}{% endif %}
      {% endfor %} {% set _nxt_emoji = {'New Moon':'🌑','First
      Quarter':'🌓','Full Moon':'🌕','Last Quarter':'🌗'} %} {% set moon_next =
      _nxt_emoji.get(_ns.nxt_name,'') ~ ' ' ~ _ns.nxt_name %} {% set
      moon_next_date = (now().date() + timedelta(days=_ns.nxt_days | round |
      int)).strftime('%B %-d') %} {% set _nm_d = (0.0 - _pos) * _cycle if 0.0 >=
      _pos else (1.0 - _pos) * _cycle %} {% set _nm_d = _nm_d if _nm_d > 0.5
      else _nm_d + _cycle %} {% set moon_new = (now().date() +
      timedelta(days=_nm_d | round | int)).strftime('%B %-d') %} {% set
      moon_illum = _illum %} {% set cwt =
      states('sensor.fishing_water_temperature') %} {% set cps =
      states('sensor.fishing_current_precip_score') | int(0) %} {% set cws =
      states('sensor.fishing_current_wind_score') | int(0) %} {% set cts =
      states('sensor.fishing_current_tide_score') | int(0) %} {% set ctps =
      states('sensor.fishing_current_temp_score') | int(0) %} {% set trend =
      states('sensor.fishing_current_trend') %} {% set hi =
      states('sensor.fishing_today_high_score') %} {% set lo =
      states('sensor.fishing_today_low_score') %} {% set ns =
      namespace(driver='Rain', lowest_pct=100) %} {% for factor, score, cap in
      [('Rain', cps, 40), ('Wind', cws, 25), ('Tide', cts, 25), ('Water Temp',
      ctps, 10)] %}
        {% set pct = (score / cap * 100) | int %}
        {% if pct < ns.lowest_pct %}
          {% set ns.lowest_pct = pct %}
          {% set ns.driver = factor %}
        {% endif %}
      {% endfor %} {% if trend == '↑ Improving' %}{% set trend_icon = '↑' %}{%
      set trend_color = 'green' %} {% elif trend == '↓ Declining' %}{% set
      trend_icon = '↓' %}{% set trend_color = 'red' %} {% else %}{% set
      trend_icon = '→' %}{% set trend_color = 'grey' %}{% endif %}

      {% if clabel == 'Good' %}**🟢 GOOD** — Score: **{{ cscore }}/100**
      &nbsp;&nbsp; <font color="{{ trend_color }}">**{{ trend_icon }}**</font>
      {{ trend.split(' ')[1] if trend != '→ Unchanged' else 'Unchanged' }} *({{
      states('sensor.fishing_current_top_driver') }})* {% elif clabel == 'Fair'
      %}**🟡 FAIR** — Score: **{{ cscore }}/100** &nbsp;&nbsp; <font color="{{
      trend_color }}">**{{ trend_icon }}**</font> {{ trend.split(' ')[1] if
      trend != '→ Unchanged' else 'Unchanged' }} *({{
      states('sensor.fishing_current_top_driver') }})* {% else %}**🔴 POOR** —
      Score: **{{ cscore }}/100** &nbsp;&nbsp; <font color="{{ trend_color
      }}">**{{ trend_icon }}**</font> {{ trend.split(' ')[1] if trend != '→
      Unchanged' else 'Unchanged' }} *({{
      states('sensor.fishing_current_top_driver') }})* {% endif %}

      Range today: {{ lo }} – {{ hi }} pts

      | Factor | Score | Rating | |---|---|---| | 🌧 Rain in Fishing Window ({{
      cprecip }}%) | {{ cps }}/40 | {{ 'Good' if cps >= 30 else 'Fair' if cps >=
      20 else 'Poor' }} | | 💨 Wind ({{ cwind }} mph) | {{ cws }}/25 | {{ 'Good'
      if cws >= 25 else 'Fair' if cws >= 13 else 'Poor' }} | | 🌊 Tide ({{ ctide
      }}) | {{ cts }}/25 | {{ 'Good' if cts >= 25 else 'Fair' if cts >= 10 else
      'Poor' }} | | 🌡 Water Temp ({{ 'N/A' if cwt in ['unknown','unavailable']
      else cwt | float(0) | round(1) ~ 'F' }}) | {{ ctps }}/10 | {{ 'Good' if
      ctps >= 10 else 'Fair' if ctps >= 5 else 'Poor' }} |

      **🌊 Next Tide:** {{ states('sensor.fishing_next_tide_display') }}

      **🔄 Slack Tide:** {{ states('sensor.fishing_slack_tide_display') }}

      **🌧 Rain in Fishing Window:** {{ cprecip }}% | **All Day:** {{
      states('sensor.fishing_tomorrow_precip_probability') | float(0) | round
      }}%

      **🌙 Moon:** {{ moon_cur }} ({{ moon_illum }}% illuminated) → {{ moon_next
      }} on {{ moon_next_date }} | 🌑 New Moon: {{ moon_new }}
  - type: markdown
    content: >
      ### 🔭 Tomorrow's Forecast

      {% set flabel = states('sensor.fishing_condition_label') %} {% set fscore
      = states('sensor.fishing_condition_score') | int(0) %} {% set fpw =
      states('sensor.fishing_window_precip_probability') %} {% set fprecip = fpw
      | float(states('sensor.fishing_tomorrow_precip_probability') | float(0))
      if fpw not in ['unknown','unavailable'] else
      states('sensor.fishing_tomorrow_precip_probability') | float(0) %} {% set
      fwind = states('sensor.fishing_wind_speed') | float(0) | round(1) %} {%
      set fwt = states('sensor.fishing_water_temperature') %} {% set _t_cycle =
      29.53059 %} {% set _t_days_since = (now().timestamp() / 86400 - 10957 - 6)
      | int + 1 %} {% set _t_pos = (_t_days_since % _t_cycle) / _t_cycle %} {%
      set _t_illum = (((1 - cos((_t_pos - 0.5) * 2 * pi)) / 2) * 100) | round %}
      {% set _t_phase_map = {'new_moon':'🌑 New Moon','waxing_crescent':'🌒
      Waxing Crescent','first_quarter':'🌓 First Quarter','waxing_gibbous':'🌔
      Waxing Gibbous','full_moon':'🌕 Full Moon','waning_gibbous':'🌖 Waning
      Gibbous','last_quarter':'🌗 Last Quarter','waning_crescent':'🌘 Waning
      Crescent'} %} {% set _t_phase_thresholds =
      [('new_moon',0.0,0.033),('waxing_crescent',0.033,0.25),('first_quarter',0.25,0.283),('waxing_gibbous',0.283,0.5),('full_moon',0.5,0.533),('waning_gibbous',0.533,0.75),('last_quarter',0.75,0.783),('waning_crescent',0.783,1.0)]
      %} {% set _t_ns = namespace(raw='waxing_crescent') %} {% for praw, pstart,
      pend in _t_phase_thresholds %}{% if pstart <= _t_pos < pend %}{% set
      _t_ns.raw = praw %}{% endif %}{% endfor %} {% set tmoon_cur =
      _t_phase_map.get(_t_ns.raw, _t_ns.raw | replace('_',' ') | title) %} {%
      set _t_phases = [('New Moon', 0.0), ('First Quarter', 0.25), ('Full Moon',
      0.5), ('Last Quarter', 0.75)] %} {% set _t_nxt = namespace(nxt_name='',
      nxt_days=999) %} {% for pname, ppos in _t_phases %}
        {% set _td = (ppos - _t_pos) * _t_cycle if ppos >= _t_pos else (1.0 - _t_pos + ppos) * _t_cycle %}
        {% if _td > 0.5 and _td < _t_nxt.nxt_days %}{% set _t_nxt.nxt_days = _td %}{% set _t_nxt.nxt_name = pname %}{% endif %}
      {% endfor %} {% set _t_emoji = {'New Moon':'🌑','First Quarter':'🌓','Full
      Moon':'🌕','Last Quarter':'🌗'} %} {% set tmoon_next =
      _t_emoji.get(_t_nxt.nxt_name,'') ~ ' ' ~ _t_nxt.nxt_name %} {% set
      tmoon_next_date = (now().date() + timedelta(days=(_t_nxt.nxt_days | round
      | int) + 1)).strftime('%B %-d') %} {% set _t_nm_d = (0.0 - _t_pos) *
      _t_cycle if 0.0 >= _t_pos else (1.0 - _t_pos) * _t_cycle %} {% set _t_nm_d
      = _t_nm_d if _t_nm_d > 0.5 else _t_nm_d + _t_cycle %} {% set tmoon_new =
      (now().date() + timedelta(days=(_t_nm_d | round | int) + 1)).strftime('%B
      %-d') %} {% set tmoon_illum = _t_illum %} {% set fps =
      states('sensor.fishing_forecast_precip_score') | int(0) %} {% set fws =
      states('sensor.fishing_forecast_wind_score') | int(0) %} {% set fts =
      states('sensor.fishing_forecast_tide_score') | int(0) %} {% set ftps =
      states('sensor.fishing_forecast_temp_score') | int(0) %}

      **Forecast for:** {{ (now().date() + timedelta(days=1)).strftime('%A, %B
      %-d') }}

      {% set ftrend = states('sensor.fishing_forecast_trend') %} {% set ns2 =
      namespace(driver='Rain', lowest_pct=100) %} {% for factor, score, cap in
      [('Rain', fps, 40), ('Wind', fws, 25), ('Tide', fts, 25), ('Water Temp',
      ftps, 10)] %}
        {% set pct = (score / cap * 100) | int %}
        {% if pct < ns2.lowest_pct %}
          {% set ns2.lowest_pct = pct %}
          {% set ns2.driver = factor %}
        {% endif %}
      {% endfor %} {% if ftrend == '↑ Improving' %}{% set ftrend_icon = '↑' %}{%
      set ftrend_color = 'green' %} {% elif ftrend == '↓ Declining' %}{% set
      ftrend_icon = '↓' %}{% set ftrend_color = 'red' %} {% else %}{% set
      ftrend_icon = '→' %}{% set ftrend_color = 'grey' %}{% endif %}

      {% if flabel == 'Good' %}**🟢 GOOD** — Score: **{{ fscore }}/100**
      &nbsp;&nbsp; <font color="{{ ftrend_color }}">**{{ ftrend_icon }}**</font>
      {{ ftrend.split(' ')[1] if ftrend != '→ Unchanged' else 'Unchanged' }}
      *({{ states('sensor.fishing_forecast_top_driver') }})* {% elif flabel ==
      'Fair' %}**🟡 FAIR** — Score: **{{ fscore }}/100** &nbsp;&nbsp; <font
      color="{{ ftrend_color }}">**{{ ftrend_icon }}**</font> {{ ftrend.split('
      ')[1] if ftrend != '→ Unchanged' else 'Unchanged' }} *({{
      states('sensor.fishing_forecast_top_driver') }})* {% else %}**🔴 POOR** —
      Score: **{{ fscore }}/100** &nbsp;&nbsp; <font color="{{ ftrend_color
      }}">**{{ ftrend_icon }}**</font> {{ ftrend.split(' ')[1] if ftrend != '→
      Unchanged' else 'Unchanged' }} *({{
      states('sensor.fishing_forecast_top_driver') }})* {% endif %}

      | Factor | Score | Rating | |---|---|---| | 🌧 Rain in Fishing Window ({{
      fprecip | round }}%) | {{ fps }}/40 | {{ 'Good' if fps >= 30 else 'Fair'
      if fps >= 20 else 'Poor' }} | | 💨 Wind ({{ fwind }} mph) | {{ fws }}/25 |
      {{ 'Good' if fws >= 25 else 'Fair' if fws >= 13 else 'Poor' }} | | 🌊 Tide
      Timing | {{ fts }}/25 | {{ 'Good' if fts >= 25 else 'Fair' if fts >= 10
      else 'Poor' }} | | 🌡 Water Temp ({{ 'N/A' if fwt in
      ['unknown','unavailable'] else fwt | float(0) | round(1) ~ 'F' }}) | {{
      ftps }}/10 | {{ 'Good' if ftps >= 10 else 'Fair' if ftps >= 5 else 'Poor'
      }} |

      **🌊 Next High Tide:** {{
      states('sensor.fishing_tomorrow_high_tide_display') }}

      **🔄 Slack Tide:** {{ states('sensor.fishing_tomorrow_slack_tide_display')
      }}

      **🌧 Rain in Fishing Window:** {{ fprecip | round }}% | **All Day:** {{
      states('sensor.fishing_tomorrow_precip_probability') }}%

      **🌙 Moon:** {{ tmoon_cur }} ({{ tmoon_illum }}% illuminated) → {{
      tmoon_next }} on {{ tmoon_next_date }} | 🌑 New Moon: {{ tmoon_new }}
  - type: glance
    title: Current Wind & Weather
    columns: 3
    entities:
      - entity: sensor.fishing_wind_speed
        name: Wind Speed
        icon: mdi:weather-windy
      - entity: sensor.fishing_wind_gusts
        name: Gusts
        icon: mdi:weather-windy-variant
      - entity: sensor.fishing_wind_direction_2
        name: Direction
        icon: mdi:compass
      - entity: sensor.fishing_air_temperature
        name: Air Temp
        icon: mdi:thermometer
      - entity: sensor.fishing_humidity
        name: Humidity
        icon: mdi:water-percent
      - entity: sensor.fishing_precipitation_conditions
        name: Precip
        icon: mdi:weather-rainy
  - type: glance
    title: Current Water Conditions
    columns: 3
    entities:
      - entity: sensor.fishing_water_temperature
        name: Water Temp
        icon: mdi:thermometer-water
      - entity: sensor.fishing_water_level
        name: Water Level
        icon: mdi:waves
      - entity: sensor.fishing_current_tide_direction
        name: Tide Direction
        icon: mdi:arrow-up-down
  - type: statistics-graph
    title: 📈 45-Day Fishing Conditions Trend
    entities:
      - entity: sensor.fishing_current_condition_score
        name: Today's Conditions
    days_to_show: 45
    period: day
    stat_types:
      - mean
      - min
      - max
    chart_type: line
